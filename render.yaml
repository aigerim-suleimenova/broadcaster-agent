services:
  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  - type: web
    name: broadcaster-agent-frontend
    env: node
    rootDir: research-canvas-standalone
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_AGENT_URL
        value: https://broadcaster-agent-backend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_REDIRECT_URI
        value: https://broadcaster-agent-frontend.onrender.com/api/auth/callback
    healthCheckPath: /

  # ── Python Agent (FastAPI / AG-UI) ───────────────────────────────────────────
  - type: web
    name: broadcaster-agent-backend
    env: python
    rootDir: research-canvas-standalone
    pythonVersion: "3.12"
    buildCommand: pip install -r agent/requirements.txt
    startCommand: uvicorn agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PORT
        value: 8000
    healthCheckPath: /health
