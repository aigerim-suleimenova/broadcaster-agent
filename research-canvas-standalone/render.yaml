services:
  - type: web
    name: broadcaster-agent-frontend
    env: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://broadcaster-agent.onrender.com
      - key: NEXT_PUBLIC_GROQ_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_REDIRECT_URI
        value: https://${RENDER_EXTERNAL_URL}/api/auth/callback
    healthCheckPath: /

  - type: web
    name: broadcaster-agent-backend
    env: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: python agents/python/inference_server.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AGENT_HOST
        value: 0.0.0.0
      - key: AGENT_PORT
        value: 8000
    healthCheckPath: /health
    healthCheckTimeout: 10
